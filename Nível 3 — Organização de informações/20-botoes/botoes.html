<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Informações sobre a página -->
    <meta name="description" content="Uso de botões e elementos básicos do HTML">
    <meta name="keywords" content="HTML, button, elementos, tags">
    <meta name="author" content="Gilvam J. T. de Oliveira">

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Ícone da página -->
    <link rel="icon" href="assets/img/botões-de-playstation.png" type="image/x-icon">

    <title>Página com Botões</title>
</head>

<body>
    <h1>Ações do Sistema</h1>

    <p>
        <button type="button">Cadastrar</button>
        Cria um novo registro no sistema.
    </p>

    <p>
        <button type="button">Editar</button>
        Permite alterar os dados de um registro existente.
    </p>

    <p>
        <button type="button">Excluir</button>
        Remove um registro do sistema permanentemente.
    </p>

    <p>
        <button type="button" onclick="window.history.back()">Voltar</button>
        Retorna para a página anterior.
    </p>

    <h2>Desafio: interação com JavaScript</h2>
    <p>
        <button type="button" onclick="alert('Ação simulada com sucesso!')">
            Testar ação
        </button>
        Ao clicar, uma mensagem é exibida usando JavaScript.
    </p>
</body>

</html>
