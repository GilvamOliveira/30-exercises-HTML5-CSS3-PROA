<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Informações sobre a página -->
    <meta name="description" content="Incorporando iframe no HTML">
    <meta name="keywords" content="HTML, listas, elementos, tags">
    <meta name="author" content="Gilvam J. T. de Oliveira">

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Ícone da página -->
    <link rel="icon" href="assets/img/iframe.png" type="image/x-icon">

    <title>Incorporando Conteúdo Externo</title>
</head>

<body>
    <h1>Conteúdo Incorporado</h1>

    <section>
        <h2>Mapa de localização</h2>
        <p>Abaixo está um mapa do OpenStreetMap incorporado por meio de
            um &lt;iframe&gt;, mostrando a região da Cidade de Guarulhos,
            em São Paulo.</p>

        <iframe title="Cidade de Guarulhos" width="500" height="350"
            src="https://www.openstreetmap.org/export/embed?bbox=-46.55233383178712%2C-23.450412092561347%2C-46.47611618041993%2C-23.399141441971693&amp;layer=mapnik">
        </iframe>
        <br>
        <small>
            <a href="https://www.openstreetmap.org/#map=14/-23.42478/-46.51423" target="_blank">Ver mapa ampliado</a>
        </small>
    </section>
</body>

</html>
