<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Informações sobre a página -->
    <meta name="description" content="JavaScript elementos básicos no HTML">
    <meta name="keywords" content="HTML, JavaScript, elementos, tags">
    <meta name="author" content="Gilvam J. T. de Oliveira">

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Ícone da página -->
    <link rel="icon" href="assets/img/javascript.png" type="image/x-icon">

    <title>Primeiro Contato com JavaScript no HTML</title>
</head>

<body>
    <h1 id="titulo">Clique no botão para mudar este texto</h1>

    <button onclick="mudarTexto()">Clique aqui</button>
    <button onclick="mudarNovamente()">Mudar de novo</button>

    <script>
        // Esta função altera o conteúdo do h1 quando o primeiro botão é clicado
        function mudarTexto() {
            document.getElementById("titulo").textContent =
                "Você clicou no botão! O JavaScript alterou este texto.";
        }

        // Esta função altera o texto uma segunda vez, mostrando que o
        // conteúdo pode ser modificado quantas vezes forem necessárias
        function mudarNovamente() {
            document.getElementById("titulo").textContent =
                "Texto alterado novamente pelo segundo botão!";
        }
    </script>
</body>

</html>
