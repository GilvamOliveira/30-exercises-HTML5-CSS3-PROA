<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Informações sobre a página -->
    <meta name="description" content="Estudo de Comentários no HTML">
    <meta name="keywords" content="HTML, Comentários">
    <meta name="author" content="Gilvam J. T. de Oliveira">

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Ícone da página -->
    <link rel="icon" href="assets/img/comentários.png" type="image/x-icon">

    <title>Página com Comentários HTML</title>
    <!-- Comentário 1: define o título e a codificação da página -->
</head>

<body>

    <!-- Comentário 2: início do cabeçalho da página -->
    <header>
        <h1>Meu Site Pessoal</h1>
        <p>Bem-vindo(a) ao meu espaço na web!</p>
    </header>

    <!-- Comentário 3: início do conteúdo principal -->
    <main>
        <h2>Sobre este projeto</h2>
        <p>Esta página foi criada para praticar o uso de comentários
            em HTML, que ajudam a organizar e documentar o código.</p>

        <!-- Comentário 4: explicando uma decisão de código -->
        <!-- Optei por usar <main> em vez de apenas <div> porque essa
             tag é semântica e indica claramente que este é o conteúdo
             principal da página, o que ajuda na acessibilidade. -->

        <!-- <p>Este parágrafo está comentado e por isso não aparece
             no navegador — é o exemplo pedido no desafio.</p> -->
    </main>

    <!-- Comentário 5: início do rodapé -->
    <footer>
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
