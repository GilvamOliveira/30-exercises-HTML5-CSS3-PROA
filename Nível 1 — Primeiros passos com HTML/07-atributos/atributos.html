<!DOCTYPE html>
<html lang="pt-BR">
<!-- O atributo lang="pt-BR" informa ao navegador e a leitores de tela
     que o idioma principal da página é o português do Brasil -->

<head>
     <!-- Configurações básicas da página -->
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- Informações sobre a página -->
     <meta name="description" content="Estudo de Atributos do HTML">
     <meta name="keywords" content="HTML, Atributoss">
     <meta name="author" content="Gilvam J. T. de Oliveira">

     <!-- Arquivo CSS -->
     <link rel="stylesheet" href="assets/css/style.css">

     <!-- Ícone da página -->
     <link rel="icon" href="assets/img/atributos.png" type="image/x-icon">
     <title>Trabalhando com Atributos HTML</title>
</head>

<body>
     <h1>Exemplos de Atributos HTML</h1>

     <!-- href define o destino do link; title mostra uma dica ao passar
         o mouse -->
     <p>
          <a href="https://www.w3schools.com" title="Visite o W3Schools">
               Clique aqui para visitar o W3Schools
          </a>
     </p>

     <!-- src define a origem da imagem; alt é o texto alternativo;
         width e height definem o tamanho de exibição -->
     <img src="assets/img/example.jpg" alt="Imagem de exemplo ilustrativa"
          title="Esta é uma imagem de exemplo" width="200" height="120">

     <p>A imagem acima usa os atributos <code>src</code>, <code>alt</code>,
          <code>title</code>, <code>width</code> e <code>height</code>.
     </p>
</body>

</html>
